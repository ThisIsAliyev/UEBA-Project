# UEBA Core Detection Rules - Top 25 Pack
# =========================================
# High-fidelity detection rules for Windows security monitoring
# Aligned with MITRE ATT&CK framework

rules:
  # ============================================
  # CREDENTIAL ACCESS (5 rules)
  # ============================================
  
  - id: "R001"
    name: "Suspicious LSASS Process Access"
    description: "Detect credential dumping attempts via LSASS memory access. Sysmon ID 10 with suspicious access rights."
    enabled: true
    logsource:
      service: "sysmon"
      event_ids: [10]
    risk:
      base_score: 85
      confidence: "high"
      risk_object: "user"
    mitre:
      - tactic: "Credential Access"
        technique_id: "T1003.001"
        technique: "OS Credential Dumping: LSASS Memory"
    match:
      all:
        - field: "target_image"
          op: "endswith"
          value: "\\lsass.exe"
        - field: "granted_access"
          op: "contains_any"
          value: ["0x1010", "0x1410", "0x1438", "0x143a", "0x1fffff", "0x1f0fff", "0x1f1fff", "0x1f3fff"]
      none:
        - field: "source_image"
          op: "endswith_any"
          value: ["\\MsMpEng.exe", "\\MsSense.exe", "\\SenseIR.exe", "\\csrss.exe", "\\wininit.exe", "\\wmiprvse.exe", "\\svchost.exe"]
    tuning:
      dedup_minutes: 5
      allowlist:
        - source_image: ["\\MsMpEng.exe", "\\MsSense.exe"]
      notes:
        - "Whitelist legitimate AV/EDR processes"
        - "Common FP: Windows Defender, CrowdStrike, Carbon Black"
    tests:
      - "Run procdump -ma lsass.exe in safe lab to trigger"

  - id: "R002"
    name: "Suspicious Memory Dump File Creation"
    description: "Detect creation of .dmp files by suspicious processes like taskmgr or procdump"
    enabled: true
    logsource:
      service: "sysmon"
      event_ids: [11]
    risk:
      base_score: 75
      confidence: "high"
      risk_object: "user"
    mitre:
      - tactic: "Credential Access"
        technique_id: "T1003.001"
        technique: "OS Credential Dumping: LSASS Memory"
    match:
      all:
        - field: "target_filename"
          op: "endswith"
          value: ".dmp"
        - field: "process_name"
          op: "equals_any"
          value: ["taskmgr.exe", "procdump.exe", "procdump64.exe", "rundll32.exe", "comsvcs.dll"]
    tuning:
      dedup_minutes: 10
      notes:
        - "May trigger on legitimate crash dumps"
        - "Check if target contains 'lsass' in filename"

  - id: "R003"
    name: "Explicit Credential Logon"
    description: "Detect use of explicit credentials (runas, credential delegation)"
    enabled: true
    logsource:
      service: "security"
      event_ids: [4648]
    risk:
      base_score: 45
      confidence: "medium"
      risk_object: "user"
    mitre:
      - tactic: "Credential Access"
        technique_id: "T1078"
        technique: "Valid Accounts"
    match:
      all:
        - field: "event_id"
          op: "equals"
          value: 4648
      none:
        - field: "process_name"
          op: "endswith_any"
          value: ["\\svchost.exe", "\\lsass.exe", "\\services.exe"]
    tuning:
      dedup_minutes: 15
      notes:
        - "High volume in environments with service accounts"
        - "Focus on interactive users using explicit creds"

  - id: "R004"
    name: "Kerberoasting Indicator"
    description: "Detect potential Kerberoasting via TGS requests with weak encryption"
    enabled: true
    logsource:
      service: "security"
      event_ids: [4769]
    risk:
      base_score: 70
      confidence: "medium"
      risk_object: "user"
    mitre:
      - tactic: "Credential Access"
        technique_id: "T1558.003"
        technique: "Steal or Forge Kerberos Tickets: Kerberoasting"
    match:
      all:
        - field: "event_id"
          op: "equals"
          value: 4769
        - field: "ticket_encryption_type"
          op: "equals_any"
          value: ["0x17", "0x18", "23", "24"]
      none:
        - field: "service_name"
          op: "endswith"
          value: "$"
    tuning:
      dedup_minutes: 5
      notes:
        - "RC4 encryption (0x17/0x18) is suspicious"
        - "Exclude machine accounts (ending in $)"

  - id: "R005"
    name: "Browser Credential Store Access"
    description: "Detect access to browser credential storage files"
    enabled: true
    logsource:
      service: "sysmon"
      event_ids: [11]
    risk:
      base_score: 65
      confidence: "medium"
      risk_object: "user"
    mitre:
      - tactic: "Credential Access"
        technique_id: "T1555.003"
        technique: "Credentials from Password Stores: Credentials from Web Browsers"
    match:
      any:
        - field: "target_filename"
          op: "contains"
          value: "\\Google\\Chrome\\User Data\\Default\\Login Data"
        - field: "target_filename"
          op: "contains"
          value: "\\Mozilla\\Firefox\\Profiles\\"
        - field: "target_filename"
          op: "contains"
          value: "\\Microsoft\\Edge\\User Data\\Default\\Login Data"
      none:
        - field: "process_name"
          op: "equals_any"
          value: ["chrome.exe", "firefox.exe", "msedge.exe"]
    tuning:
      dedup_minutes: 10

  # ============================================
  # LATERAL MOVEMENT (5 rules)
  # ============================================

  - id: "R006"
    name: "PsExec Service Installation"
    description: "Detect PsExec-style service installation for remote execution"
    enabled: true
    logsource:
      service: "system"
      event_ids: [7045]
    risk:
      base_score: 75
      confidence: "high"
      risk_object: "host"
    mitre:
      - tactic: "Lateral Movement"
        technique_id: "T1570"
        technique: "Lateral Tool Transfer"
      - tactic: "Execution"
        technique_id: "T1569.002"
        technique: "System Services: Service Execution"
    match:
      any:
        - field: "service_name"
          op: "regex"
          value: "^PSEXE(SVC|C)"
        - field: "service_file_name"
          op: "contains_any"
          value: ["PSEXESVC", "paexec", "csexec", "remcom"]
    tuning:
      dedup_minutes: 5
      notes:
        - "May be legitimate admin tool usage"
        - "Correlate with source of connection"

  - id: "R007"
    name: "WMI Remote Process Execution"
    description: "Detect process spawned by WMI provider (remote WMI execution)"
    enabled: true
    logsource:
      service: "sysmon"
      event_ids: [1]
    risk:
      base_score: 65
      confidence: "medium"
      risk_object: "host"
    mitre:
      - tactic: "Lateral Movement"
        technique_id: "T1047"
        technique: "Windows Management Instrumentation"
    match:
      all:
        - field: "parent_process_name"
          op: "equals"
          value: "WmiPrvSE.exe"
      none:
        - field: "process_name"
          op: "equals_any"
          value: ["WmiPrvSE.exe", "WmiApSrv.exe", "mofcomp.exe", "scrcons.exe"]
    tuning:
      dedup_minutes: 5
      notes:
        - "WmiPrvSE spawning cmd/powershell is highly suspicious"

  - id: "R008"
    name: "WinRM Remote Shell Execution"
    description: "Detect process spawned by WinRM provider (remote PowerShell)"
    enabled: true
    logsource:
      service: "sysmon"
      event_ids: [1]
    risk:
      base_score: 60
      confidence: "medium"
      risk_object: "host"
    mitre:
      - tactic: "Lateral Movement"
        technique_id: "T1021.006"
        technique: "Remote Services: Windows Remote Management"
    match:
      all:
        - field: "parent_process_name"
          op: "equals"
          value: "wsmprovhost.exe"
    tuning:
      dedup_minutes: 5
      notes:
        - "Common in environments using PowerShell remoting"
        - "Baseline normal WinRM usage first"

  - id: "R009"
    name: "RDP Logon from New Workstation"
    description: "Detect RDP logon (type 10) which may indicate lateral movement"
    enabled: true
    logsource:
      service: "security"
      event_ids: [4624]
    risk:
      base_score: 40
      confidence: "low"
      risk_object: "user"
    mitre:
      - tactic: "Lateral Movement"
        technique_id: "T1021.001"
        technique: "Remote Services: Remote Desktop Protocol"
    match:
      all:
        - field: "logon_type"
          op: "equals"
          value: 10
    tuning:
      dedup_minutes: 30
      notes:
        - "Combine with rare_host_for_user modifier for better detection"
        - "High volume in RDP-heavy environments"

  - id: "R010"
    name: "Admin Share Access"
    description: "Detect access to administrative shares (C$, ADMIN$)"
    enabled: true
    logsource:
      service: "security"
      event_ids: [5140, 5145]
    risk:
      base_score: 55
      confidence: "medium"
      risk_object: "user"
    mitre:
      - tactic: "Lateral Movement"
        technique_id: "T1021.002"
        technique: "Remote Services: SMB/Windows Admin Shares"
    match:
      all:
        - field: "share_name"
          op: "equals_any"
          value: ["\\\\*\\C$", "\\\\*\\ADMIN$", "\\\\*\\IPC$", "C$", "ADMIN$"]
    tuning:
      dedup_minutes: 10
      notes:
        - "Common for IT admin tools"
        - "Focus on non-admin users accessing admin shares"

  # ============================================
  # PERSISTENCE (4 rules)
  # ============================================

  - id: "R011"
    name: "Scheduled Task Created"
    description: "Detect creation of scheduled tasks for persistence"
    enabled: true
    logsource:
      service: "security"
      event_ids: [4698]
    risk:
      base_score: 55
      confidence: "medium"
      risk_object: "user"
    mitre:
      - tactic: "Persistence"
        technique_id: "T1053.005"
        technique: "Scheduled Task/Job: Scheduled Task"
    match:
      all:
        - field: "event_id"
          op: "equals"
          value: 4698
    tuning:
      dedup_minutes: 10
      notes:
        - "Review task_content for suspicious commands"
        - "Focus on tasks created by non-SYSTEM users"

  - id: "R012"
    name: "Registry Run Key Modification"
    description: "Detect modification of Run/RunOnce registry keys for persistence"
    enabled: true
    logsource:
      service: "sysmon"
      event_ids: [13]
    risk:
      base_score: 65
      confidence: "medium"
      risk_object: "user"
    mitre:
      - tactic: "Persistence"
        technique_id: "T1547.001"
        technique: "Boot or Logon Autostart Execution: Registry Run Keys"
    match:
      all:
        - field: "target_object"
          op: "contains_any"
          value: 
            - "\\CurrentVersion\\Run"
            - "\\CurrentVersion\\RunOnce"
            - "\\CurrentVersion\\RunServices"
            - "\\CurrentVersion\\Policies\\Explorer\\Run"
    tuning:
      dedup_minutes: 5
      notes:
        - "Common for legitimate software installers"
        - "Check registry_details for suspicious paths"

  - id: "R013"
    name: "WMI Event Subscription"
    description: "Detect WMI event subscription creation for persistence"
    enabled: true
    logsource:
      service: "sysmon"
      event_ids: [19, 20, 21]
    risk:
      base_score: 80
      confidence: "high"
      risk_object: "host"
    mitre:
      - tactic: "Persistence"
        technique_id: "T1546.003"
        technique: "Event Triggered Execution: WMI Event Subscription"
    match:
      all:
        - field: "event_id"
          op: "equals_any"
          value: [19, 20, 21]
    tuning:
      dedup_minutes: 10
      notes:
        - "WMI persistence is rare and highly suspicious"
        - "Review consumer command for malicious content"

  - id: "R014"
    name: "New Service Installed"
    description: "Detect installation of new Windows services"
    enabled: true
    logsource:
      service: "system"
      event_ids: [7045]
    risk:
      base_score: 50
      confidence: "medium"
      risk_object: "host"
    mitre:
      - tactic: "Persistence"
        technique_id: "T1543.003"
        technique: "Create or Modify System Process: Windows Service"
    match:
      all:
        - field: "event_id"
          op: "equals"
          value: 7045
      none:
        - field: "service_file_name"
          op: "startswith_any"
          value: ["C:\\Windows\\", "C:\\Program Files\\", "C:\\Program Files (x86)\\"]
    tuning:
      dedup_minutes: 10
      notes:
        - "Focus on services with executables outside standard paths"

  # ============================================
  # DEFENSE EVASION (5 rules)
  # ============================================

  - id: "R015"
    name: "Security Log Cleared"
    description: "Detect clearing of Windows Security event log"
    enabled: true
    logsource:
      service: "security"
      event_ids: [1102]
    risk:
      base_score: 90
      confidence: "high"
      risk_object: "user"
    mitre:
      - tactic: "Defense Evasion"
        technique_id: "T1070.001"
        technique: "Indicator Removal: Clear Windows Event Logs"
    match:
      all:
        - field: "event_id"
          op: "equals"
          value: 1102
    tuning:
      dedup_minutes: 60
      notes:
        - "Almost always malicious unless during maintenance"
        - "Immediate investigation required"

  - id: "R016"
    name: "Event Log Clearing via Wevtutil"
    description: "Detect use of wevtutil to clear event logs"
    enabled: true
    logsource:
      service: "sysmon"
      event_ids: [1]
    risk:
      base_score: 85
      confidence: "high"
      risk_object: "user"
    mitre:
      - tactic: "Defense Evasion"
        technique_id: "T1070.001"
        technique: "Indicator Removal: Clear Windows Event Logs"
    match:
      all:
        - field: "process_name"
          op: "equals"
          value: "wevtutil.exe"
        - field: "command_line"
          op: "contains"
          value: " cl "
    tuning:
      dedup_minutes: 5

  - id: "R017"
    name: "Security Tool Disabled via Service Control"
    description: "Detect attempts to stop security services"
    enabled: true
    logsource:
      service: "sysmon"
      event_ids: [1]
    risk:
      base_score: 80
      confidence: "high"
      risk_object: "user"
    mitre:
      - tactic: "Defense Evasion"
        technique_id: "T1562.001"
        technique: "Impair Defenses: Disable or Modify Tools"
    match:
      all:
        - field: "process_name"
          op: "equals_any"
          value: ["sc.exe", "net.exe", "net1.exe"]
        - field: "command_line"
          op: "contains_any"
          value: ["stop", "delete", "disabled"]
        - field: "command_line"
          op: "contains_any"
          value: ["windefend", "sense", "mssense", "defender", "mpssvc", "wscsvc", "securityhealthservice"]
    tuning:
      dedup_minutes: 5

  - id: "R018"
    name: "Suspicious PowerShell Execution"
    description: "Detect PowerShell with encoded commands, hidden window, or download cradles"
    enabled: true
    logsource:
      service: "sysmon"
      event_ids: [1]
    risk:
      base_score: 75
      confidence: "high"
      risk_object: "user"
    mitre:
      - tactic: "Defense Evasion"
        technique_id: "T1059.001"
        technique: "Command and Scripting Interpreter: PowerShell"
      - tactic: "Execution"
        technique_id: "T1059.001"
        technique: "Command and Scripting Interpreter: PowerShell"
    match:
      all:
        - field: "process_name"
          op: "equals_any"
          value: ["powershell.exe", "pwsh.exe"]
        - field: "command_line"
          op: "contains_any"
          value: 
            - "-enc"
            - "-EncodedCommand"
            - "-e "
            - "-ec "
            - "hidden"
            - "-nop"
            - "-noni"
            - "bypass"
            - "downloadstring"
            - "downloadfile"
            - "iex"
            - "invoke-expression"
            - "webclient"
            - "bitstransfer"
    tuning:
      dedup_minutes: 5
      notes:
        - "Very common technique, tune allowlist carefully"

  - id: "R019"
    name: "AMSI Bypass Attempt"
    description: "Detect attempts to bypass AMSI (Antimalware Scan Interface)"
    enabled: true
    logsource:
      service: "sysmon"
      event_ids: [1]
    risk:
      base_score: 85
      confidence: "high"
      risk_object: "user"
    mitre:
      - tactic: "Defense Evasion"
        technique_id: "T1562.001"
        technique: "Impair Defenses: Disable or Modify Tools"
    match:
      all:
        - field: "command_line"
          op: "contains_any"
          value:
            - "amsiInitFailed"
            - "AmsiScanBuffer"
            - "amsi.dll"
            - "AmsiUtils"
            - "amsiContext"
    tuning:
      dedup_minutes: 5

  # ============================================
  # MALWARE-LIKE BEHAVIOR (6 rules)
  # ============================================

  - id: "R020"
    name: "CreateRemoteThread into Sensitive Process"
    description: "Detect remote thread creation into sensitive processes (injection)"
    enabled: true
    logsource:
      service: "sysmon"
      event_ids: [8]
    risk:
      base_score: 85
      confidence: "high"
      risk_object: "user"
    mitre:
      - tactic: "Defense Evasion"
        technique_id: "T1055.003"
        technique: "Process Injection: Thread Execution Hijacking"
    match:
      all:
        - field: "target_image"
          op: "endswith_any"
          value: ["\\lsass.exe", "\\csrss.exe", "\\winlogon.exe", "\\services.exe", "\\svchost.exe"]
      none:
        - field: "source_image"
          op: "endswith_any"
          value: ["\\csrss.exe", "\\wininit.exe", "\\smss.exe", "\\MsMpEng.exe"]
    tuning:
      dedup_minutes: 5
      notes:
        - "Sysmon ID 8 does NOT have GrantedAccess field"
        - "Check start_address for suspicious memory regions"

  - id: "R021"
    name: "Process Hollowing Indicator"
    description: "Detect potential process hollowing via suspicious process access"
    enabled: true
    logsource:
      service: "sysmon"
      event_ids: [10]
    risk:
      base_score: 80
      confidence: "medium"
      risk_object: "user"
    mitre:
      - tactic: "Defense Evasion"
        technique_id: "T1055.012"
        technique: "Process Injection: Process Hollowing"
    match:
      all:
        - field: "granted_access"
          op: "contains_any"
          value: ["0x1fffff", "0x800", "0x801"]
        - field: "call_trace"
          op: "contains"
          value: "UNKNOWN"
    tuning:
      dedup_minutes: 5

  - id: "R022"
    name: "Unsigned DLL Load from User-Writable Path"
    description: "Detect DLL loading from suspicious user-writable locations"
    enabled: true
    logsource:
      service: "sysmon"
      event_ids: [7]
    risk:
      base_score: 60
      confidence: "medium"
      risk_object: "host"
    mitre:
      - tactic: "Defense Evasion"
        technique_id: "T1574.002"
        technique: "Hijack Execution Flow: DLL Side-Loading"
    match:
      all:
        - field: "image_path"
          op: "contains_any"
          value:
            - "\\Users\\"
            - "\\AppData\\Local\\Temp"
            - "\\Windows\\Temp"
            - "\\ProgramData\\"
            - "\\Downloads\\"
      none:
        - field: "image_path"
          op: "endswith_any"
          value: [".exe"]
    tuning:
      dedup_minutes: 10
      notes:
        - "High volume - tune with signature verification if available"

  - id: "R023"
    name: "Suspicious Parent-Child Process"
    description: "Detect Office applications spawning script interpreters"
    enabled: true
    logsource:
      service: "sysmon"
      event_ids: [1]
    risk:
      base_score: 75
      confidence: "high"
      risk_object: "user"
    mitre:
      - tactic: "Execution"
        technique_id: "T1204.002"
        technique: "User Execution: Malicious File"
    match:
      all:
        - field: "parent_process_name"
          op: "equals_any"
          value: ["WINWORD.EXE", "EXCEL.EXE", "POWERPNT.EXE", "OUTLOOK.EXE", "MSACCESS.EXE"]
        - field: "process_name"
          op: "equals_any"
          value: ["cmd.exe", "powershell.exe", "pwsh.exe", "wscript.exe", "cscript.exe", "mshta.exe", "rundll32.exe"]
    tuning:
      dedup_minutes: 5

  - id: "R024"
    name: "Certutil Download"
    description: "Detect use of certutil for file download (LOLBin)"
    enabled: true
    logsource:
      service: "sysmon"
      event_ids: [1]
    risk:
      base_score: 70
      confidence: "high"
      risk_object: "user"
    mitre:
      - tactic: "Command and Control"
        technique_id: "T1105"
        technique: "Ingress Tool Transfer"
    match:
      all:
        - field: "process_name"
          op: "equals"
          value: "certutil.exe"
        - field: "command_line"
          op: "contains_any"
          value: ["-urlcache", "-verifyctl", "http://", "https://", "ftp://"]
    tuning:
      dedup_minutes: 5

  - id: "R025"
    name: "Mshta Script Execution"
    description: "Detect mshta.exe executing scripts (common malware technique)"
    enabled: true
    logsource:
      service: "sysmon"
      event_ids: [1]
    risk:
      base_score: 75
      confidence: "high"
      risk_object: "user"
    mitre:
      - tactic: "Defense Evasion"
        technique_id: "T1218.005"
        technique: "System Binary Proxy Execution: Mshta"
    match:
      all:
        - field: "process_name"
          op: "equals"
          value: "mshta.exe"
        - field: "command_line"
          op: "contains_any"
          value: ["javascript:", "vbscript:", "http://", "https://", ".hta"]
    tuning:
      dedup_minutes: 5
