# MITRE ATT&CK Mapping Configuration
# Maps alert behaviors/rule names to MITRE ATT&CK tactics and techniques

mappings:
  # Insider Threat Scenarios (Demo)
  after_hours_data_exfil:
    tactics:
      - TA0010  # Exfiltration
    techniques:
      - T1048.003  # Exfiltration Over Alternative Protocol: Exfiltration to Cloud Storage
    description: "After-hours data exfiltration to external cloud services"
  
  privilege_escalation:
    tactics:
      - TA0004  # Privilege Escalation
      - TA0003  # Persistence
    techniques:
      - T1548  # Abuse Elevation Control Mechanism
      - T1053.005  # Scheduled Task/Job: Scheduled Task
    description: "Privilege escalation attempt via UAC bypass, registry modification, or scheduled tasks"
  
  credential_dumping:
    tactics:
      - TA0006  # Credential Access
    techniques:
      - T1003.001  # OS Credential Dumping: LSASS Memory
    description: "Credential dumping using tools like mimikatz or procdump"
  
  # Real-time risk events
  realtime_risk_event:
    tactics:
      - TA0001  # Initial Access (generic)
    techniques:
      - T1078  # Valid Accounts (generic)
    description: "High-risk event detected in real-time scoring"
  
  # UEBA anomaly (batch scan)
  ueba_anomaly:
    tactics:
      - TA0001  # Initial Access (generic)
    techniques:
      - T1078  # Valid Accounts (generic)
    description: "Anomalous behavior detected via baseline deviation"
  
  # Rule-based behaviors (from rules.yaml)
  failed_login_burst:
    tactics:
      - TA0006  # Credential Access
    techniques:
      - T1110.003  # Brute Force: Password Spraying
    description: "Multiple failed login attempts"
  
  suspicious_path_execution:
    tactics:
      - TA0002  # Execution
    techniques:
      - T1055  # Process Injection
    description: "Process execution from suspicious path"
  
  security_log_clearing:
    tactics:
      - TA0005  # Defense Evasion
    techniques:
      - T1070.001  # Indicator Removal: Clear Windows Event Logs
    description: "Security event log clearing detected"
  
  restricted_hours_login:
    tactics:
      - TA0001  # Initial Access
    techniques:
      - T1078  # Valid Accounts
    description: "Login during restricted hours"
  
  firewall_disabled:
    tactics:
      - TA0005  # Defense Evasion
    techniques:
      - T1562.004  # Impair Defenses: Disable or Modify System Firewall
    description: "Windows Firewall disabled"

# Default fallback mapping (used when behavior not found)
default:
  tactics:
    - TA0001  # Initial Access
  techniques:
    - T1078  # Valid Accounts
  description: "Generic security event"

