# Risk Engine Thresholds Configuration
# =====================================
# Defines risk score thresholds and weights for risk calculation

# Risk level thresholds (0-100 scale)
risk_levels:
  low_max: 40      # 0-40 = low risk
  medium_max: 70  # 41-70 = medium risk
  high_min: 71     # 71-100 = high risk

# Component weights for final risk calculation
# Formula: final_risk = (rule_weight * rule_score) + (anomaly_weight * anomaly_score) + (context_weight * context_score)
# NOTE: Weights normalized so active weights (rule + anomaly) sum to 1.0 when context=0.0
# This ensures CRITICAL (80+) is reachable when rule_score=100 and anomaly_score=100
weights:
  rule: 0.4286     # Rule-based scoring weight (normalized: 0.3/(0.3+0.4))
  anomaly: 0.5714  # Anomaly detection weight (normalized: 0.4/(0.3+0.4))
  context: 0.0     # Context/embedding weight (Phase 3 - disabled until implemented)

# Fast exit thresholds
fast_exit:
  # If rule_score is below this, skip anomaly/context (for performance)
  skip_anomaly_below: 10
  skip_context_below: 10
  
  # If rule_score is above this, mark as high risk immediately
  high_risk_above: 90

# Context window settings
context:
  # Sliding window size (number of events to keep per user/host)
  window_size: 50
  
  # Time window for "recent events" calculation (minutes)
  recent_events_window_minutes: 5
  
  # Maximum age for context (minutes) - older contexts are pruned
  max_context_age_minutes: 60

